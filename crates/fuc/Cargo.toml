[package]
name = "fuc"
version = "0.2.0"
edition = "2021"
authors = ["Fusion Team"]
description = "Fusion Compiler (fuc) - Rust-based compiler core"

[dependencies]
# Core dependencies from workspace
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
parking_lot = { workspace = true }
walkdir = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }
libc = { workspace = true }
bincode = "1.3"
wasm-encoder = "0.219"
signal-hook = "0.3"

# LLVM backend (optional - requires LLVM installation)
inkwell = { version = "0.9", features = ["llvm20-1"], optional = true }

# Post-Quantum Cryptography (50/50 hybrid enforcement)
pqcrypto-mlkem = "0.1"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

[features]
default = ["llvm"]
wasm = []
llvm = ["inkwell"]
# Both backends can be enabled together
all = ["llvm", "wasm"]

[[bin]]
name = "fuc"
path = "src/main.rs"

[dev-dependencies]
wasmparser = "0.219"
wasmtime = "24.0"
tempfile = "3"