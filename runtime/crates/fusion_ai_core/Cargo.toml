[package]
name = "fusion_ai_core"
version = "0.2.0"
edition = "2021"
authors = ["Quantum Secure Technologies Inc."]
description = "AI/ML core with autodiff and zero-copy tensor operations"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
rand = "0.8"
rand_distr = "0.4"
thiserror = "1.0"

[dev-dependencies]

[lib]
name = "fusion_ai_core"
path = "src/lib.rs"
