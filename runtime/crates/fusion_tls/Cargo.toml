[package]
name = "fusion_tls"
version = "0.2.0"
edition = "2021"
authors = ["Quantum Secure Technologies Inc."]
description = "TLS 1.3 with hybrid post-quantum cryptography (X25519 + ML-KEM-768)"
license = "MIT OR Apache-2.0"

[dependencies]
bytes = "1.9"
thiserror = "2.0"
ring = "0.17"
rand = "0.8"

[dev-dependencies]
tokio = { version = "1.42", features = ["full", "test-util"] }

[lib]
name = "fusion_tls"
path = "src/lib.rs"
