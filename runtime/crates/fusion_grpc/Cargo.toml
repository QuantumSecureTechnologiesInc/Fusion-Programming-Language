[package]
name = "fusion_grpc"
version = "0.2.0"
edition = "2021"
authors = ["Quantum Secure Technologies Inc."]
description = "gRPC server and client framework with unary and streaming RPCs"
license = "MIT OR Apache-2.0"

[dependencies]
bytes = "1.9"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.42", features = ["full", "test-util"] }

[lib]
name = "fusion_grpc"
path = "src/lib.rs"
