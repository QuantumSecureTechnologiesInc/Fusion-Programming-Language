[package]
name = "fusion-gpu-kernels"
version = "0.2.0"
edition = "2021"
authors = ["Fusion Team"]
description = "GPU kernel dispatch abstraction with CPU fallbacks for matmul, activations, softmax, and layer norm"

[dependencies]
thiserror = "2.0"
log = "0.4"

[dev-dependencies]
tempfile = "3.0"

[lints.rust]
unsafe_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
