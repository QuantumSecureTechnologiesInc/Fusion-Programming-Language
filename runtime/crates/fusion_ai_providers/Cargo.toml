[package]
name = "fusion_ai_providers"
version = "0.2.0"
edition = "2021"
authors = ["Fusion Team"]
description = "AI provider and model registry for Fusion v2.0 Vortex — supports 23+ models natively and via Ollama"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
