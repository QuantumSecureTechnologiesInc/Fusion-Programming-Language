[package]
name = "fusion_http"
version = "0.2.0"
edition = "2021"
authors = ["Quantum Secure Technologies Inc."]
description = "HTTP/1.1, HTTP/2 server and client with routing, middleware, and WebSocket upgrade"
license = "MIT OR Apache-2.0"

[dependencies]
bytes = "1.9"
thiserror = "2.0"
sha1 = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.42", features = ["full", "test-util"] }

[lib]
name = "fusion_http"
path = "src/lib.rs"
