[package]
name = "fusion_quantum"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/QuantumSecureTechnologiesInc/Fusion-Programming-Language"
authors = ["Fusion Team"]
description = "Quantum computing primitives with QPU integration and QEM middleware"

[dependencies]
fusion_core = { path = "../fusion_core" }
num-complex = "0.4"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "2.0"

[dev-dependencies]

[features]
default = []
simulation = []
