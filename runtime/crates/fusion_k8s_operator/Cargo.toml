[package]
name = "fusion_k8s_operator"
version = "2.0.0"
edition = "2021"
description = "Kubernetes operator for Fusion v2.0 Vortex applications"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
