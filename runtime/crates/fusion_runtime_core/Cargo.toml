[package]
name = "fusion_runtime_core"
version = "0.2.0"
edition = "2021"
authors = ["Quantum Secure Technologies Inc."]
description = "Custom heterogeneous runtime for Quantum/AI/Classical hybrid workloads"
license = "MIT OR Apache-2.0"

[dependencies]
fusion_traits = { path = "../fusion_traits" }
fusion_tensor_core = { path = "../fusion_tensor_core" }
fusion_quantum_core = { path = "../fusion_quantum_core" }

parking_lot = "0.12"
crossbeam = "0.8"
futures = "0.3"
tracing = "0.1"
num_cpus = "1.16"

[dev-dependencies]

[lib]
name = "fusion_runtime_core"
path = "src/lib.rs"
