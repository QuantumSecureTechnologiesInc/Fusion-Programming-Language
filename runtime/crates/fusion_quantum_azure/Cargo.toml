[package]
name = "fusion_quantum_azure"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Azure Quantum backend integration for Fusion v2.0 Vortex"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
