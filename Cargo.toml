[package]
name = "fusion_lang"
version = "0.2.0-beta.1"
edition = "2021"
authors = ["QuantumSecure Technologies Ltd"]
description = "Fusion Programming Language Compiler"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(disabled)'] }
unsafe_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Allow common patterns
module_name_repetitions = "allow"



[dependencies]
# Core Dependencies
logos = "0.14"
clap = { version = "4.4", features = ["derive"] }
lazy_static = "1.4"
regex = "1.10"
thiserror = "1.0"
sha2 = { workspace = true }
sha3 = "0.10"  # For hybrid cryptography module

# Cryptography - Classical
x25519-dalek = "2.0"
ed25519-dalek = "2.1"
rand = "0.8"

# Cryptography - Post-Quantum (NIST Standardized)
pqcrypto-mlkem = "0.1"
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

# Phase 3: Language Server Protocol (LSP)
tower-lsp = "0.20"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
chacha20poly1305 = "0.10"
async-trait = "0.1"

parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
num_cpus = "0.2"
# Dependencies for examples and scripts
anyhow = { workspace = true }
fusion_core = { workspace = true }
fusion-ai-core = { workspace = true }
fusion_quantum = { path = "registry/crates/fusion_quantum" } 
fusion_runtime_core = { path = "registry/crates/fusion_runtime_core" }
fusion_finance = { path = "registry/crates/fusion_finance" }
fusion_runtime_scheduler = { path = "registry/crates/fusion_runtime_scheduler" }

# Phase 3: WebAssembly Backend
wasm-encoder = "0.219"
wasmparser = "0.219"

[dev-dependencies]
tempfile = "3.8"

[workspace]
resolver = "2"
members = [
    "crates/fuc",
    "crates/fuc2",
    "crates/fusionc",
    "crates/fusion_test",
    "crates/fdbg",
    "runtime/crates/fusion_cortex",
    "runtime/crates/fusion_flux_resolve",
    "runtime/crates/fusion_net",
    "runtime/crates/fusion_package_registry",
    "runtime/crates/fusion_visual_compiler",
    "runtime/crates/fusion_interop_python",
    "runtime/crates/fusion_interop_javascript",
    "runtime/crates/fusion_interop_java",

    "runtime/crates/fusion_k8s_operator",
    "runtime/crates/fusion_faaS",
    "runtime/crates/fusion_mobile_ios",
    "runtime/crates/fusion_mobile_android",
    "runtime/crates/fusion_web_runtime",
    "runtime/crates/fusion_ai_providers",
]
exclude = [
    "crates/fusion_std",
    "crates/fusionc",
    "crates/tensorweave",
    "crates/fusion-monolith-core",
    "registry/crates/fusion-terminal-browser",
    "crates/settings",
    "crates/ai-core",
    "tools/forge",
    "runtime/crates/fusion_ai_core",
    "runtime/crates/fusion_core",
    "runtime/crates/fusion_finance",
    "runtime/crates/fusion_hal",
    "runtime/crates/fusion_quantum_core",
    "runtime/crates/fusion_quantum",
    "runtime/crates/fusion_runtime_core",
    "runtime/crates/fusion_runtime_hal",
    "runtime/crates/fusion_runtime_mem_mgr",
    "runtime/crates/fusion_runtime_scheduler",
    "runtime/crates/fusion_tensor_core",
    "runtime/crates/fusion_traits",
    "runtime/crates/fusion_http",
    "runtime/crates/fusion_grpc",
    "runtime/crates/fusion_tls",
    "runtime/crates/fusion_websocket",
    "runtime/crates/fusion_llm_core",
    "runtime/crates/fusion_llm_models",
    "runtime/crates/fusion_llm_training",
    "runtime/crates/fusion_gpu_kernels",
    "runtime/crates/fusion_quantum_google",
    "runtime/crates/fusion_quantum_ibm",
    "runtime/crates/fusion_quantum_aws",
    "runtime/crates/fusion_quantum_azure",
    "runtime/crates/fusion_quantum_rigetti",
    "runtime/crates/fusion_supernova",
    "runtime/crates/fusion_cortex_scheduler",
    "runtime/crates/fusion_intent",
    "runtime/crates/fusion_haft",
]


[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Fusion Team"]
license = "MIT"
repository = "https://github.com/QuantumSecureTechnologiesInc/Fusion-Programming-Language"
homepage = "https://fusion-lang.org"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Allow common patterns
module_name_repetitions = "allow"



[workspace.dependencies]
anyhow = "1.0.94"
async-trait = "0.1.83"
clap = { version = "4.5.23", features = ["derive"] }
clap_complete = "4.5.38"
serde = { version = "1.0.216", features = ["derive", "rc"] }
serde_json = "1.0.133"
tokio = { version = "1.42.0", features = ["full", "tracing"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
reqwest = { version = "0.12.9", features = ["json", "stream", "multipart"] }
bytes = "1.9.0"
async-stream = "0.3.5"
futures = "0.3.31"
thiserror = "2.0.6"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
tempfile = "3.14.0"
log = "0.4.22"
url = "2.5.4"
regex = "1.11.1"
walkdir = "2.5.0"
glob = "0.3.1"
toml = "0.8.19"
dirs = "5.0.1"
once_cell = "1.20.2"
parking_lot = "0.12.3"
base64 = "0.22.1"
rand = "0.8.5"
sha2 = "0.10.8"
hex = "0.4.3"
which = "6.0.3"
hyper = { version = "1.5.1", features = ["full"] }
tower = { version = "0.5.1" }
tower-lsp = "0.20"
similar = "2.6.0"
diff = "0.1.13"
git2 = { version = "0.19.0", default-features = false }
handlebars = "6.2.0"
proptest = "1.6.0"
async-graphql = "7.0"
petgraph = "0.6"
axum = "0.7"
wasmtime = "24.0"
pyo3 = "0.20"

# Crypto
hmac = "0.12.1"
blake3 = "1.5.0"
sha3 = "0.10.8"
pqcrypto = "0.17.0"
pqcrypto-mldsa = "0.1.0"
pqcrypto-mlkem = "0.1"
pqcrypto-sphincsplus = "0.8.0"
pqcrypto-falcon = "0.3.0"
pqcrypto-classicmceliece = "0.3.0"
ring = "0.17.8"

# Fusion Internals
# Unified Core Crate (merged type system + compiler)
fusion-core = { path = "registry/crates/fusion-core", version = "0.2.0" }
fusion_core = { path = "registry/crates/fusion-core", version = "0.2.0", package = "fusion-core", default-features = false }
fusion-ai-core = { path = "registry/crates/ai-core", version = "0.2.0" }
fusion_ai_core = { path = "registry/crates/fusion_ai_core", version = "0.2.0" }
fusion-monolith-core = { path = "crates/fusion-monolith-core", version = "3.4.1" }
fusion-policy = { path = "crates/policy", version = "0.1.0" }
fusion_std = { path = "registry/crates/std", version = "0.2.0", default-features = false }
fusion_runtime_core = { path = "registry/crates/fusion_runtime_core", version = "0.2.0" }
fusion_net = { path = "registry/crates/fusion_net", version = "0.2.0" }
fusion_http = { path = "registry/crates/http", version = "0.2.0" }
fusion_quantum_sdk = { path = "registry/crates/quantum-sdk", version = "0.2.0" }
fusion_k8s_operator = { path = "registry/crates/k8s-operator", version = "0.2.0" }
sentinael-tribrid = { path = "registry/crates/sentinel-tribrid", version = "1.0.0" }
num_complex = { package = "num-complex", version = "0.4" }
semver = { version = "1.0", features = ["serde"] }
fusion_llm_inference_engine = { path = "registry/crates/llm-inference", version = "0.2.0" }
fusion_llm_lora_manager = { path = "registry/crates/llm-lora-manager", version = "0.2.0" }
fusion_tensor_sparse = { path = "registry/crates/tensor-sparse", version = "0.2.0" }
fusion_sec_policy_engine = { path = "registry/crates/sec-policy-engine", version = "0.2.0", package = "sec-policy-engine" }
fusion_audit = { path = "registry/crates/audit", version = "0.2.0" }
fusion_sec_audit_log = { path = "registry/crates/audit", version = "0.2.0", package = "fusion-audit" }
fusion_ai_core_adapters = { path = "registry/crates/ai-core", version = "0.2.0", package = "fusion-ai-core" }


# Additional from golden-singularity
crossbeam = "0.8"
dashmap = "5.5"
libc = "0.2"
memmap2 = "0.9"
ash = "0.38"
metal = "0.28"
cuda-sys = "0.3"
socket2 = "0.5"
pin-project-lite = "0.2"
metrics = "0.21"
criterion = "0.5"
num-traits = "0.2"
ndarray = "0.15"

# VS Code Runtime
boa_engine = "0.19.0"
zip = "1.1.0"
jsonrpc-core = "18.0.0"
jsonrpc-derive = "18.0.0"
num_cpus = "1.16.0"
